<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="fireflies-title fireflies-desc">
  <title id="fireflies-title">Night sky with fireflies</title>
  <desc id="fireflies-desc">A deep blue night sky with twinkling stars and gentle fireflies drifting between distant hills.</desc>

  <defs>
    <linearGradient id="ff-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1233"/>
      <stop offset="55%" stop-color="#1b2a5c"/>
      <stop offset="100%" stop-color="#2a3b7a"/>
    </linearGradient>
    <radialGradient id="ff-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8b0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe27a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ff-moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f4f0d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f4f0d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="500" fill="url(#ff-sky)"/>

  <!-- moon -->
  <circle cx="1300" cy="120" r="55" fill="url(#ff-moon)"/>
  <circle cx="1300" cy="120" r="36" fill="#f6f1d6"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="110" r="1.2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="40" r="1.8">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="150" r="1.1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="70" r="1.4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="130" r="1.6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="50" r="1.2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="160" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="80" r="1.3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1420" cy="200" r="1.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1520" cy="60" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- distant hills -->
  <path d="M0,420 Q200,360 400,395 T800,380 T1200,400 T1600,385 L1600,500 L0,500 Z" fill="#0a0f24" opacity="0.85"/>
  <path d="M0,450 Q220,415 460,440 T900,430 T1300,445 T1600,438 L1600,500 L0,500 Z" fill="#070b1c"/>

  <!-- fireflies -->
  <g>
    <g>
      <circle r="10" fill="url(#ff-glow)"/>
      <circle r="2.2" fill="#fff5b3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="14s" repeatCount="indefinite"
        path="M120,360 C260,300 420,420 580,330 C740,250 860,400 1020,320 C1180,240 1320,380 1480,310 C1320,380 1180,260 1020,340 C860,420 740,280 580,360 C420,440 260,320 120,360 Z"/>
    </g>
    <g>
      <circle r="9" fill="url(#ff-glow)"/>
      <circle r="2" fill="#fff5b3">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="18s" begin="-3s" repeatCount="indefinite"
        path="M300,260 C480,340 660,200 840,290 C1020,380 1200,240 1380,320 C1200,240 1020,360 840,270 C660,180 480,320 300,260 Z"/>
    </g>
    <g>
      <circle r="8" fill="url(#ff-glow)"/>
      <circle r="1.8" fill="#fff5b3">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="22s" begin="-7s" repeatCount="indefinite"
        path="M200,180 C420,260 640,140 860,230 C1080,320 1280,200 1480,260 C1280,200 1080,300 860,210 C640,120 420,240 200,180 Z"/>
    </g>
    <g>
      <circle r="7" fill="url(#ff-glow)"/>
      <circle r="1.6" fill="#fff5b3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="16s" begin="-5s" repeatCount="indefinite"
        path="M520,400 C660,330 800,420 940,360 C1080,300 1220,380 1360,330 C1220,380 1080,320 940,380 C800,440 660,360 520,400 Z"/>
    </g>
  </g>
</svg>
