<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="forest-title forest-desc">
  <title id="forest-title">Enchanted forest</title>
  <desc id="forest-desc">Layered silhouettes of pine trees in twilight, with glowing motes of pollen drifting between trunks.</desc>

  <defs>
    <linearGradient id="ef-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2042"/>
      <stop offset="45%" stop-color="#3c365e"/>
      <stop offset="80%" stop-color="#7a5a82"/>
      <stop offset="100%" stop-color="#c08a86"/>
    </linearGradient>
    <radialGradient id="ef-mote" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffe28b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe28b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ef-haze" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#fff0c8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff0c8" stop-opacity="0"/>
    </radialGradient>

    <!-- reusable pine -->
    <symbol id="pine" viewBox="0 0 100 240" overflow="visible">
      <polygon points="50,0 78,70 62,70 90,150 70,150 100,230 0,230 30,150 10,150 38,70 22,70" fill="currentColor"/>
      <rect x="46" y="225" width="8" height="20" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- sky -->
  <rect width="1600" height="500" fill="url(#ef-sky)"/>

  <!-- soft golden haze -->
  <ellipse cx="800" cy="340" rx="900" ry="260" fill="url(#ef-haze)"/>

  <!-- back trees -->
  <g color="#2a2347" opacity="0.85">
    <use href="#pine" x="-20"  y="220" width="140" height="320"/>
    <use href="#pine" x="120"  y="210" width="120" height="300"/>
    <use href="#pine" x="240"  y="225" width="150" height="330"/>
    <use href="#pine" x="380"  y="215" width="130" height="310"/>
    <use href="#pine" x="520"  y="220" width="140" height="320"/>
    <use href="#pine" x="660"  y="200" width="160" height="340"/>
    <use href="#pine" x="820"  y="215" width="140" height="320"/>
    <use href="#pine" x="960"  y="225" width="130" height="310"/>
    <use href="#pine" x="1090" y="210" width="150" height="330"/>
    <use href="#pine" x="1230" y="220" width="140" height="320"/>
    <use href="#pine" x="1370" y="215" width="130" height="310"/>
    <use href="#pine" x="1500" y="220" width="140" height="320"/>
  </g>

  <!-- mid trees -->
  <g color="#181432" opacity="0.95">
    <use href="#pine" x="40"   y="270" width="170" height="360"/>
    <use href="#pine" x="220"  y="265" width="180" height="370"/>
    <use href="#pine" x="420"  y="275" width="160" height="350"/>
    <use href="#pine" x="600"  y="260" width="190" height="380"/>
    <use href="#pine" x="800"  y="270" width="170" height="360"/>
    <use href="#pine" x="980"  y="265" width="180" height="370"/>
    <use href="#pine" x="1180" y="275" width="160" height="350"/>
    <use href="#pine" x="1360" y="260" width="190" height="380"/>
  </g>

  <!-- foreground trees -->
  <g color="#0a0918">
    <use href="#pine" x="-60" y="320" width="240" height="420"/>
    <use href="#pine" x="180" y="330" width="220" height="400"/>
    <use href="#pine" x="420" y="315" width="250" height="430"/>
    <use href="#pine" x="700" y="325" width="230" height="410"/>
    <use href="#pine" x="960" y="320" width="240" height="420"/>
    <use href="#pine" x="1220" y="330" width="220" height="400"/>
    <use href="#pine" x="1440" y="320" width="240" height="420"/>
  </g>

  <!-- ground -->
  <rect y="470" width="1600" height="30" fill="#06050f"/>

  <!-- glowing motes -->
  <g>
    <g>
      <circle r="9" fill="url(#ef-mote)"/>
      <circle r="1.8" fill="#fff5c0">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="13s" repeatCount="indefinite"
        path="M100,420 C260,360 420,440 580,380 C740,320 900,420 1060,360 C1220,300 1380,420 1500,360 C1380,420 1220,340 1060,400 C900,460 740,360 580,420 C420,480 260,400 100,420 Z"/>
    </g>
    <g>
      <circle r="7" fill="url(#ef-mote)"/>
      <circle r="1.5" fill="#fff5c0">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="17s" begin="-4s" repeatCount="indefinite"
        path="M250,300 C440,360 620,260 800,330 C980,400 1160,280 1340,340 C1160,280 980,360 800,290 C620,220 440,320 250,300 Z"/>
    </g>
    <g>
      <circle r="6" fill="url(#ef-mote)"/>
      <circle r="1.3" fill="#fff5c0">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="20s" begin="-9s" repeatCount="indefinite"
        path="M150,200 C340,260 520,180 700,240 C880,300 1080,200 1260,260 C1080,200 880,280 700,220 C520,160 340,240 150,200 Z"/>
    </g>
    <g>
      <circle r="8" fill="url(#ef-mote)"/>
      <circle r="1.6" fill="#fff5c0">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <animateMotion dur="15s" begin="-6s" repeatCount="indefinite"
        path="M500,440 C680,380 860,460 1040,400 C1220,340 1400,440 1520,380 C1400,440 1220,360 1040,420 C860,480 680,400 500,440 Z"/>
    </g>
  </g>
</svg>
